```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Security Alert</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #ff1a1a;
    font-family: "Courier New", monospace;
}

body {
    animation: flicker 0.12s infinite;
}

.scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 3px,
            rgba(255,0,0,.035) 4px
        );
}

.vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 19;
    box-shadow: inset 0 0 180px #000;
}

#screen {
    width: 100%;
    height: 100%;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
}

.warning {
    font-size: clamp(35px, 7vw, 85px);
    font-weight: bold;
    text-align: center;
    text-shadow:
        0 0 8px red,
        0 0 25px red,
        0 0 50px red;
    animation: warningBlink .55s infinite;
}

.subtitle {
    margin-top: 10px;
    color: #fff;
    font-size: clamp(14px, 2vw, 22px);
    letter-spacing: 4px;
    text-align: center;
}

.terminal {
    width: min(950px, 94%);
    height: 310px;
    margin-top: 25px;
    padding: 20px;
    border: 1px solid #ff2020;
    background: rgba(5,0,0,.94);
    box-shadow:
        0 0 20px #ff000055,
        inset 0 0 30px #ff000018;
    overflow: hidden;
}

.line {
    line-height: 1.55;
    font-size: clamp(12px, 1.5vw, 17px);
    white-space: nowrap;
}

.green {
    color: #00ff55;
}

.white {
    color: #ddd;
}

.red {
    color: #ff2020;
}

.progressBox {
    width: min(700px, 90%);
    height: 24px;
    border: 1px solid red;
    margin-top: 25px;
    padding: 3px;
}

.progress {
    height: 100%;
    width: 0%;
    background: red;
    box-shadow: 0 0 15px red;
    transition: width .25s linear;
}

.status {
    margin-top: 12px;
    color: #ff2020;
    font-size: 15px;
    letter-spacing: 2px;
}

.countdown {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #050000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

.countdownText {
    color: red;
    font-size: clamp(25px, 5vw, 60px);
    text-align: center;
    text-shadow: 0 0 20px red;
}

.number {
    margin-top: 20px;
    font-size: clamp(80px, 18vw, 220px);
    font-weight: bold;
    color: white;
    text-shadow: 0 0 30px red;
}

.final {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 30;
    background: #000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
}

.final h1 {
    color: #00ff55;
    font-size: clamp(35px, 7vw, 80px);
    text-shadow: 0 0 20px #00ff55;
}

.final p {
    color: white;
    font-size: clamp(16px, 2vw, 25px);
    line-height: 1.7;
}

@keyframes warningBlink {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: .25;
    }
}

@keyframes flicker {
    0%, 100% {
        filter: brightness(1);
    }
    50% {
        filter: brightness(.93);
    }
}

@keyframes shake {
    0% { transform: translate(0,0); }
    20% { transform: translate(-7px,4px); }
    40% { transform: translate(6px,-5px); }
    60% { transform: translate(-4px,-3px); }
    80% { transform: translate(5px,5px); }
    100% { transform: translate(0,0); }
}

.shake {
    animation: shake .08s infinite;
}

.redFlash {
    animation: redFlash .15s infinite;
}

@keyframes redFlash {
    0%, 100% {
        background: #000;
    }
    50% {
        background: #190000;
    }
}
</style>
</head>

<body>

<div class="scanlines"></div>
<div class="vignette"></div>

<div id="screen">

    <div class="warning">
        SYSTEM COMPROMISED
    </div>

    <div class="subtitle">
        UNAUTHORIZED ACCESS DETECTED
    </div>

    <div class="terminal" id="terminal"></div>

    <div class="progressBox">
        <div class="progress" id="progress"></div>
    </div>

    <div class="status" id="status">
        SECURITY PROTOCOL: ACTIVE
    </div>

</div>

<div class="countdown" id="countdown">
    <div class="countdownText">
        CRITICAL SYSTEM FAILURE
    </div>
    <div class="number" id="number">5</div>
</div>

<div class="final" id="final">
    <h1>YOU GOT PRANKED</h1>
    <p>
        Nothing was hacked.<br>
        No files were accessed.<br>
        No information was collected.<br><br>
        This was only a harmless prank.
    </p>
</div>

<script>

const terminal = document.getElementById("terminal");
const progress = document.getElementById("progress");
const status = document.getElementById("status");
const screen = document.getElementById("screen");
const countdown = document.getElementById("countdown");
const number = document.getElementById("number");
const finalScreen = document.getElementById("final");

const messages = [
    ["INITIALIZING SECURITY SCAN...", "white"],
    ["Connecting to system security layer...", "green"],
    ["Connection established.", "green"],
    ["Scanning active processes...", "white"],
    ["Checking system permissions...", "white"],
    ["Checking protected directories...", "white"],
    ["Unauthorized process detected.", "red"],
    ["Security authentication bypass detected.", "red"],
    ["Remote session detected.", "red"],
    ["Attempting to terminate unauthorized session...", "white"],
    ["Termination failed.", "red"],
    ["Access level: ADMINISTRATOR", "red"],
    ["System protection: DISABLED", "red"],
    ["Preparing emergency lockdown...", "red"],
    ["CRITICAL SECURITY BREACH DETECTED.", "red"]
];

let i = 0;
let percent = 0;

function addMessage() {

    if (i >= messages.length) {
        startFinalSequence();
        return;
    }

    const line = document.createElement("div");
    line.className = "line " + messages[i][1];
    line.textContent = "> " + messages[i][0];

    terminal.appendChild(line);
    terminal.scrollTop = terminal.scrollHeight;

    percent += Math.floor(100 / messages.length);
    progress.style.width = Math.min(percent, 100) + "%";

    if (messages[i][0].includes("CRITICAL")) {
        status.textContent = "CRITICAL ALERT: SYSTEM SECURITY FAILURE";
    }

    i++;

    setTimeout(addMessage, 650 + Math.random() * 600);
}

function startFinalSequence() {

    setTimeout(() => {

        screen.classList.add("shake");
        document.body.classList.add("redFlash");

        setTimeout(() => {

            screen.style.display = "none";
            countdown.style.display = "flex";

            let n = 5;
            number.textContent = n;

            const timer = setInterval(() => {

                n--;

                if (n <= 0) {
                    clearInterval(timer);

                    countdown.style.display = "none";
                    finalScreen.style.display = "flex";

                    return;
                }

                number.textContent = n;

            }, 1000);

        }, 1800);

    }, 1200);
}

setTimeout(addMessage, 1000);

</script>

</body>
</html>
